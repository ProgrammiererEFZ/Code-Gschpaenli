# Builds, tests and verifies the plugin on every push to main and on every pull request.
# - build:        validates the Gradle wrapper (done by setup-gradle), runs `check` (unit tests) and `buildPlugin`,
#                 uploads the plugin ZIP as a workflow artifact.
# - verify:       runs the IntelliJ Plugin Verifier (`verifyPlugin`) in parallel with build and uploads its reports.
# - releaseDraft: on main only, (re)creates a draft GitHub release with tag v<pluginVersion> and the [Unreleased]
#                 section of CHANGELOG.md as notes. Publishing that draft triggers release.yml. Skipped (with a
#                 notice) once v<pluginVersion> is released: bump pluginVersion to get the next draft.
#
# Adapted from https://github.com/JetBrains/intellij-platform-plugin-template

name: Build
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew check verifyPluginProjectConfiguration buildPlugin

      - name: Collect test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip

  # Runs in parallel with `build`: verifyPlugin builds the plugin ZIP itself, so it does not need build's artifact.
  # No disk cleanup step: the two IDEs the verifier downloads take ~10 GB and ubuntu-latest has ~88 GB free.
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run plugin verification
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Remove old release drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Reads pluginVersion straight from gradle.properties, so a push after a release needs no Java or Gradle at all.
      # GitHub refuses a second release with the same tag and the Marketplace refuses a second upload of the same
      # version, so the remaining steps are skipped until pluginVersion is bumped.
      - name: Check version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^pluginVersion *= *//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::No pluginVersion found in gradle.properties."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::notice::v$VERSION is already released; bump pluginVersion in gradle.properties to prepare the next release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.version.outputs.released != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # No cache: getChangelog only needs the Gradle plugins (~30 MB), not the 2.4 GB IDE the cache holds.
      - name: Setup Gradle
        if: steps.version.outputs.released != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Create release draft
        if: steps.version.outputs.released != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file="$RELEASE_NOTE"

          gh release create "v$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RELEASE_NOTE"
